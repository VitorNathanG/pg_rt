services:
  db:
    image: postgres:17
    container_name: pg_rt
    environment:
      POSTGRES_USER: rt
      POSTGRES_PASSWORD: rt
      POSTGRES_DB: rt
    ports:
      - "5433:5432"
    # Parallel workers exchange tuples through /dev/shm, which Docker caps at
    # 64 MB by default.  A parallel Gather over a full-resolution ray set
    # overruns that and the query dies with "could not resize shared memory
    # segment ... No space left on device".
    #
    # The renderer no longer trips this -- its scratch tables are TEMP, and a
    # query that reads one is never parallel -- but an ad-hoc query against the
    # scene tables still can, and 1g costs nothing to leave in place.
    shm_size: 1g
    command:
      - postgres
      # Each bounce is one big set-oriented join; give the executor room.
      - -c
      - work_mem=512MB
      - -c
      - shared_buffers=512MB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rt -d rt"]
      interval: 2s
      timeout: 3s
      retries: 30
